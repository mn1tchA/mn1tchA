<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:18px}
    .cmd{fill:#e6edf3}
    .p{fill:#3fb950}
    .out{fill:#58a6ff}
    .dim{fill:#8b949e}
    @keyframes w{from{width:0}to{width:var(--w)}}
    @keyframes show{to{opacity:1}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .r1{--w:64.8px;animation:w .6s steps(6,end) .4s forwards}
    .r2{--w:140.4px;animation:w 1.1s steps(13,end) 1.9s forwards}
    .o1{opacity:0;animation:show .01s 1.1s forwards}
    .o2{opacity:0;animation:show .01s 3.2s forwards}
    .p3{opacity:0;animation:show .01s 3.8s forwards}
    .cur{animation:blink 1s step-end 3.8s infinite;opacity:0}
  </style>
  <defs>
    <clipPath id="c1"><rect class="r1" x="68" y="68" height="28" width="0"/></clipPath>
    <clipPath id="c2"><rect class="r2" x="68" y="148" height="28" width="0"/></clipPath>
  </defs>
  <rect width="820" height="250" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect width="820" height="38" rx="12" fill="#161b22"/>
  <rect y="26" width="820" height="12" fill="#161b22"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="19" r="6" fill="#27c93f"/>
  <text x="410" y="24" text-anchor="middle" class="t dim" style="font-size:13px">hocine@oran: ~</text>

  <text x="40" y="88" class="t p">$</text>
  <g clip-path="url(#c1)"><text x="68" y="88" class="t cmd">whoami</text></g>
  <text x="40" y="118" class="t out o1">hocine zair</text>

  <text x="40" y="168" class="t p">$</text>
  <g clip-path="url(#c2)"><text x="68" y="168" class="t cmd">cat focus.txt</text></g>
  <text x="40" y="198" class="t out o2">ML / deep learning / modern AI (RAG, agents...)</text>

  <text x="40" y="232" class="t p p3">$</text>
  <rect class="cur" x="68" y="216" width="10" height="20" fill="#e6edf3"/>
</svg>
